# =====================================================================
# Backoffice Rotte d'incenso (Sveltia CMS)
# Laura entra su /admin/, modifica i campi e salva: il sito si
# ripubblica da solo. I contenuti vivono come file nel repository.
# PRIMA DEL LANCIO: sostituire "alboo89/rotte-incenso" col repo vero.
# Generato programmaticamente: per modifiche strutturali conviene rigenerarlo.
# =====================================================================
backend:
  name: github
  repo: alboo89/rotte-incenso
  branch: main
media_folder: src/assets/img
public_folder: /assets/img
locale: it
collections:
- name: impostazioni
  label: Impostazioni del sito
  files:
  - name: sito
    label: Contatti e testi generali
    file: src/_data/sito.json
    fields:
    - name: nome
      label: Nome del sito
      widget: string
    - name: url
      label: Indirizzo del sito (per SEO)
      widget: string
    - name: email
      label: Email
      widget: string
    - name: telefono
      label: Telefono
      widget: string
    - name: whatsapp_numero
      label: Numero WhatsApp (senza + e senza spazi, es. 393331234567)
      widget: string
    - name: instagram
      label: Link Instagram (vuoto = icona nascosta)
      widget: string
      required: false
    - name: web3forms_key
      label: Chiave Web3Forms (tecnica, non toccare)
      widget: string
    - name: umami_website_id
      label: ID sito Umami (statistiche; vuoto = spente)
      widget: string
      required: false
    - name: it
      label: Testi in italiano
      widget: object
      fields:
      - name: slogan
        label: Slogan
        widget: string
      - name: descrizione_seo
        label: Descrizione per i motori di ricerca
        widget: text
      - name: claim_footer
        label: Frase nel footer
        widget: text
      - name: whatsapp_messaggio
        label: Messaggio WhatsApp precompilato
        widget: text
      - name: cta_titolo
        label: 'Invito finale: titolo'
        widget: string
      - name: cta_testo
        label: 'Invito finale: testo'
        widget: text
      - name: cta_bottone
        label: 'Invito finale: pulsante'
        widget: string
    - name: en
      label: English texts
      widget: object
      fields:
      - name: slogan
        label: Slogan
        widget: string
      - name: descrizione_seo
        label: SEO description
        widget: text
      - name: claim_footer
        label: Footer sentence
        widget: text
      - name: whatsapp_messaggio
        label: Pre-filled WhatsApp message
        widget: text
      - name: cta_titolo
        label: 'Final call: title'
        widget: string
      - name: cta_testo
        label: 'Final call: text'
        widget: text
      - name: cta_bottone
        label: 'Final call: button'
        widget: string
